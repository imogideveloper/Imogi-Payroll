[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "imogi_payroll"
authors = [{name = "IMOGI", email = "hello@imogi.tech"}]
description = "Imogi Payroll - Modul Perhitungan BPJS & PPh 21 untuk ERPNext Indonesia"
requires-python = ">=3.10"
readme = "README.md"
version = "1.0.0"
# Sengaja kosong. frappe dan erpnext disediakan oleh bench, bukan oleh
# pip. Mencantumkannya di sini membuat uv mencoba me-resolve frappe
# sebagai paket biasa, lalu menolaknya karena frappe sendiri memakai
# pypika sebagai dependensi URL git:
#   "Package `pypika` was included as a URL dependency"
# Versi minimum frappe/erpnext dinyatakan di [tool.bench.frappe-dependencies].
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pre-commit"
]

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0"
erpnext = ">=16.0.0"

[tool.black]
line-length = 99

[tool.isort]
profile = "black"
line_length = 99

[tool.pytest.ini_options]
testpaths = ["imogi_payroll"]
