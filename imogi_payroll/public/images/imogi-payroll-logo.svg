<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#19A974"/>
      <stop offset="1" stop-color="#0B7A54"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC93C"/>
      <stop offset="1" stop-color="#FFA800"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>

  <!-- payslip card -->
  <rect x="15" y="12" width="28" height="36" rx="4" fill="#ffffff" fill-opacity="0.96"/>
  <rect x="20" y="19" width="18" height="3" rx="1.5" fill="#0B7A54" fill-opacity="0.55"/>
  <rect x="20" y="26" width="18" height="2.2" rx="1.1" fill="#0B7A54" fill-opacity="0.3"/>
  <rect x="20" y="31" width="12" height="2.2" rx="1.1" fill="#0B7A54" fill-opacity="0.3"/>
  <rect x="20" y="38" width="18" height="2.6" rx="1.3" fill="#0B7A54" fill-opacity="0.45"/>

  <!-- coin / currency badge -->
  <circle cx="45" cy="42" r="12" fill="url(#badgeGrad)" stroke="#ffffff" stroke-width="2.5"/>
  <text x="45" y="47" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#7A4A00">Rp</text>
</svg>
